name: Validate portfolio analysis
on:
  push:
    paths:
      - 'python/**'
      - 'data/**'
      - '.github/workflows/validate-analysis.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas pyxlsb
      - name: Check Python syntax
        run: python -m py_compile python/analyze_amazon.py
      - name: Run analysis against repository workbook
        run: python python/analyze_amazon.py
      - name: Upload generated analysis
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-analysis
          path: analysis/
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: failure()
        run: echo "Review the failed step logs to diagnose data schema or dependency mismatches."
